<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingo Drop · Amplitude Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070A12; --text: #E8EDF6; --muted: #8A94A7;
    --glass: rgba(255,255,255,0.04); --line: rgba(255,255,255,0.08);
    --accent: #F97316; --accent2: #FACC15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg);
    background-image: radial-gradient(1000px 640px at 32% 38%, rgba(249,115,22,0.18), transparent 70%),
                      radial-gradient(700px 480px at 88% 100%, rgba(250,204,21,0.10), transparent 70%);
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .topbar {
    height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: rgba(7,10,18,0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: relative; z-index: 20;
  }
  .back { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 13px; padding: 6px 10px; border-radius: 8px; transition: color .2s, background .2s; }
  .back:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .divider { width: 1px; height: 22px; background: var(--line); }
  .labname { font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .logo { width: 22px; height: 16px; border-radius: 4px; background: linear-gradient(160deg, #fff, var(--accent2) 30%, var(--accent)); box-shadow: 0 0 14px rgba(249,115,22,0.65); }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: var(--accent2); border: 1px solid rgba(249,115,22,0.55); background: rgba(249,115,22,0.16); }
  .app { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; display: flex; overflow: hidden; }
  #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; touch-action: none; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }
  #art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #sidebar {
    width: 340px; flex: none; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    border-left: 1px solid var(--line); background: rgba(7,10,18,0.35);
  }
  .sec { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 14px; }
  .sec h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .02em; }
  .muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 12px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; font-size: 13px; margin-bottom: 14px; }
  .kv b { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; text-align: right; }
  .btn {
    width: 100%; height: 38px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; font-size: 14px;
    color: #fff; background: linear-gradient(135deg, #F97316, #C2410C);
    transition: filter .18s, transform .18s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../" aria-label="Back to Amplitude Labs">← Amplitude Labs</a>
  <span class="divider"></span>
  <span class="labname"><span class="logo" aria-hidden="true"></span>Lingo Drop</span>
  <span class="pill">World Languages</span>
</header>
<div class="app">
  <div id="stage"><canvas id="art"></canvas></div>
  <aside id="sidebar" aria-label="Lab controls">
    <section class="sec">
      <h2>Español · Gender</h2>
      <p class="muted">Cards show the noun without its article. Fling each one into el (masculine) or la (feminine).</p>
      <div class="kv">
        <span>Score</span><b id="score">0</b>
        <span>Sorted</span><b id="sorted">0</b>
      </div>
      <button class="btn" id="btnReset" type="button" aria-label="Reset the round">Reset</button>
    </section>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
/* Tunable numbers. Change one, reload, and the sim follows. */
const CONFIG = {
  worldW: 1600,
  worldH: 900,
  bound: 44,
  wall: 18,
  colW: 308,
  gap: 22,
  lip: 70,
  cardH: 76,
  chamfer: 12,
  spawnY: 158,
  spawnEvery: 1600,
  maxCards: 10,
  fling: 1.05,
  grabStiff: 0.5,
  grabDamp: 0.12,
  points: 100,
  step: 1000 / 60
};

const { Engine, World, Bodies, Body, Composite, Constraint, Events, Query, Sleeping, Vector } = Matter;

/* Common high-school nouns. The card shows the word; the bin is the gender. */
const NOUNS = [
  ['libro','m'],['perro','m'],['gato','m'],['colegio','m'],['amigo','m'],['coche','m'],['tren','m'],
  ['lápiz','m'],['cuaderno','m'],['reloj','m'],['teléfono','m'],['parque','m'],['árbol','m'],['sol','m'],
  ['niño','m'],['hombre','m'],['país','m'],['pueblo','m'],['año','m'],['mes','m'],['trabajo','m'],
  ['deporte','m'],['cine','m'],['bolígrafo','m'],['examen','m'],['avión','m'],['museo','m'],['barrio','m'],
  ['casa','f'],['escuela','f'],['mesa','f'],['silla','f'],['puerta','f'],['ventana','f'],['ciudad','f'],
  ['calle','f'],['noche','f'],['mañana','f'],['tarde','f'],['semana','f'],['hora','f'],['clase','f'],
  ['pregunta','f'],['respuesta','f'],['playa','f'],['montaña','f'],['flor','f'],['luna','f'],['estrella','f'],
  ['niña','f'],['mujer','f'],['familia','f'],['vida','f'],['canción','f'],['película','f'],['biblioteca','f'],
  ['tienda','f'],['tarea','f']
];

const engine = Engine.create({ enableSleeping: true });
engine.positionIterations = 8;
engine.velocityIterations = 6;
engine.gravity.y = 1;
const world = engine.world;

const stage = document.getElementById('stage');
const art = document.getElementById('art');
const ctx = art.getContext('2d');
const measure = document.createElement('canvas').getContext('2d');

let cards = [];
let bins = [];
let queue = [];
let layout = null;
let drag = null;
let bag = [];
let score = 0;
let sorted = 0;
let spawnAcc = 0;
let W = 1, H = 1, DPR = 1, fit = 1;

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function addStatic(x, y, w, h) {
  Composite.add(world, Bodies.rectangle(x, y, w, h, {
    isStatic: true, friction: 0.45, restitution: 0.04, label: 'wall'
  }));
}

function buildArena() {
  if (drag) {
    Composite.remove(world, drag.constraint);
    drag = null;
    stage.classList.remove('grabbing');
  }
  Composite.clear(world, false);
  cards = [];
  bins = [];
  queue = [];
  const B = CONFIG.bound;
  const Ww = CONFIG.worldW;
  const Hh = CONFIG.worldH;
  const left0 = B, left1 = B + CONFIG.colW;
  const right1 = Ww - B, right0 = right1 - CONFIG.colW;
  const top = B, bottom = Hh - B;
  layout = {
    tray: { minX: left1 + CONFIG.gap, maxX: right0 - CONFIG.gap },
    floorY: bottom,
    bins: [
      { id: 'm', label: 'el', sub: 'masculino', side: 'left', minX: left0, maxX: left1, minY: top, maxY: bottom, lip: CONFIG.lip, glow: 0, flash: 0 },
      { id: 'f', label: 'la', sub: 'femenino', side: 'right', minX: right0, maxX: right1, minY: top, maxY: bottom, lip: CONFIG.lip, glow: 0, flash: 0 }
    ]
  };
  addStatic(B / 2, Hh / 2, B, Hh);
  addStatic(Ww - B / 2, Hh / 2, B, Hh);
  addStatic(Ww / 2, B / 2, Ww, B);
  addStatic(Ww / 2, Hh - B / 2, Ww, B);
  const x1 = left1 - 4, x2 = right0 + 4;
  addStatic((x1 + x2) / 2, bottom - CONFIG.wall / 2, x2 - x1, CONFIG.wall);
  layout.bins.forEach(makeBin);
}

function makeBin(spec) {
  const t = CONFIG.wall;
  const opt = { isStatic: true, friction: 0.4, restitution: 0.02, label: 'bin-part' };
  const midY = (spec.minY + spec.maxY) / 2;
  const h = spec.maxY - spec.minY;
  const w = spec.maxX - spec.minX;
  const midX = (spec.minX + spec.maxX) / 2;
  const outer = spec.side === 'left'
    ? Bodies.rectangle(spec.minX + t / 2, midY, t, h, opt)
    : Bodies.rectangle(spec.maxX - t / 2, midY, t, h, opt);
  const lip = spec.side === 'left'
    ? Bodies.rectangle(spec.maxX - t / 2, spec.maxY - t - spec.lip / 2, t, spec.lip, opt)
    : Bodies.rectangle(spec.minX + t / 2, spec.maxY - t - spec.lip / 2, t, spec.lip, opt);
  const floor = Bodies.rectangle(midX, spec.maxY - t / 2, w, t, opt);
  const compound = Body.create({
    isStatic: true, label: 'bin', friction: 0.4, restitution: 0.02,
    parts: [outer, lip, floor]
  });
  Body.setStatic(compound, true);
  const sh = 44;
  const sw = Math.max(48, w - t * 2 - 36);
  const scx = spec.side === 'left' ? spec.minX + t + 8 + sw / 2 : spec.maxX - t - 8 - sw / 2;
  const scy = spec.maxY - t - sh / 2 - 6;
  const sensor = Bodies.rectangle(scx, scy, sw, sh, { isStatic: true, isSensor: true, label: 'sensor' });
  sensor.binId = spec.id;
  Composite.add(world, [compound, sensor]);
  spec.sensor = sensor;
  bins.push(spec);
}

function spawnCard() {
  if (!bag.length) bag = shuffle(NOUNS);
  const pair = bag.pop();
  const text = pair[0];
  const gender = pair[1];
  measure.font = '700 26px Inter, sans-serif';
  const w = Math.max(124, Math.min(280, measure.measureText(text).width + 44));
  const h = CONFIG.cardH;
  const span = (layout.tray.maxX - layout.tray.minX) * 0.42;
  const x = (layout.tray.minX + layout.tray.maxX) / 2 + (Math.random() - 0.5) * span;
  const body = Bodies.rectangle(x, CONFIG.spawnY, w, h, {
    chamfer: { radius: Math.min(CONFIG.chamfer, w / 2 - 2, h / 2 - 2) },
    restitution: 0.12,
    friction: 0.62,
    frictionStatic: 0.8,
    frictionAir: 0.018,
    density: 0.0016,
    slop: 0.02,
    label: 'card',
    sleepThreshold: 40
  });
  body.lingo = { text, gender, w, h, immune: 0, done: false };
  Body.setAngle(body, (Math.random() - 0.5) * 0.5);
  Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.003);
  Body.setVelocity(body, { x: (Math.random() - 0.5) * 0.06, y: 0.04 });
  Composite.add(world, body);
  cards.push(body);
}

Events.on(engine, 'collisionStart', function (ev) {
  for (let i = 0; i < ev.pairs.length; i++) {
    const p = ev.pairs[i];
    let card = null, sensor = null;
    if (p.bodyA.label === 'card' && p.bodyB.label === 'sensor') { card = p.bodyA; sensor = p.bodyB; }
    else if (p.bodyB.label === 'card' && p.bodyA.label === 'sensor') { card = p.bodyB; sensor = p.bodyA; }
    else continue;
    queue.push({ id: card.id, binId: sensor.binId });
  }
});

function processQueue() {
  const seen = {};
  while (queue.length) {
    const hit = queue.shift();
    if (seen[hit.id]) continue;
    const card = cards.find(function (c) { return c.id === hit.id; });
    if (!card || card.lingo.done) continue;
    if (drag && drag.body.id === card.id) continue;
    if (performance.now() < card.lingo.immune) continue;
    seen[hit.id] = true;
    const bin = bins.find(function (b) { return b.id === hit.binId; });
    if (!bin) continue;
    if (card.lingo.gender === bin.id) correct(card, bin);
    else wrong(card, bin);
  }
}

function correct(card, bin) {
  card.lingo.done = true;
  bin.glow = 1;
  score += CONFIG.points;
  sorted += 1;
  removeCard(card);
  paintScore();
}

function wrong(card, bin) {
  bin.flash = 1;
  card.lingo.immune = performance.now() + 900;
  const trayX = (layout.tray.minX + layout.tray.maxX) / 2;
  const outX = bin.side === 'left' ? bin.maxX + 40 : bin.minX - 40;
  const outY = Math.max(180, bin.maxY - bin.lip - card.lingo.h - 30);
  Sleeping.set(card, false);
  Body.setPosition(card, { x: outX, y: outY });
  Body.setVelocity(card, { x: Math.sign(trayX - outX) * 0.45, y: -0.35 });
  Body.setAngularVelocity(card, (Math.random() - 0.5) * 0.012);
}

function removeCard(card) {
  if (drag && drag.body === card) {
    Composite.remove(world, drag.constraint);
    drag = null;
    stage.classList.remove('grabbing');
  }
  Composite.remove(world, card);
  const i = cards.indexOf(card);
  if (i >= 0) cards.splice(i, 1);
}

function paintScore() {
  document.getElementById('score').textContent = String(score);
  document.getElementById('sorted').textContent = String(sorted);
}

function resetRound() {
  score = 0;
  sorted = 0;
  bag = [];
  spawnAcc = 0;
  buildArena();
  spawnCard();
  spawnCard();
  spawnCard();
  paintScore();
}

function stepSim() {
  Engine.update(engine, CONFIG.step);
  processQueue();
  spawnAcc += CONFIG.step;
  if (cards.length < CONFIG.maxCards && spawnAcc >= CONFIG.spawnEvery) {
    spawnAcc = 0;
    spawnCard();
  }
}

function screenToWorld(sx, sy) {
  return {
    x: CONFIG.worldW / 2 + (sx - W / 2) / fit,
    y: CONFIG.worldH / 2 + (sy - H / 2) / fit
  };
}

function localXY(e) {
  const r = art.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function pickCard(p) {
  const hits = Query.point(cards, p);
  let best = null, bestD = 1e12;
  for (let i = 0; i < hits.length; i++) {
    const b = hits[i];
    const d = (b.position.x - p.x) * (b.position.x - p.x) + (b.position.y - p.y) * (b.position.y - p.y);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

art.addEventListener('pointerdown', function (e) {
  art.setPointerCapture(e.pointerId);
  const sp = localXY(e);
  const p = screenToWorld(sp.x, sp.y);
  const body = pickCard(p);
  if (!body) return;
  Sleeping.set(body, false);
  const local = Vector.rotate({ x: p.x - body.position.x, y: p.y - body.position.y }, -body.angle);
  const constraint = Constraint.create({
    pointA: { x: p.x, y: p.y },
    bodyB: body,
    pointB: local,
    length: 0,
    stiffness: CONFIG.grabStiff,
    damping: CONFIG.grabDamp,
    label: 'grab'
  });
  Composite.add(world, constraint);
  drag = { constraint: constraint, body: body, pointerId: e.pointerId, px: p.x, py: p.y, vx: 0, vy: 0, t: performance.now() };
  stage.classList.add('grabbing');
});

window.addEventListener('pointermove', function (e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const sp = localXY(e);
  const p = screenToWorld(sp.x, sp.y);
  const now = performance.now();
  const dt = Math.max(8, now - drag.t);
  drag.vx = (p.x - drag.px) / dt;
  drag.vy = (p.y - drag.py) / dt;
  drag.px = p.x;
  drag.py = p.y;
  drag.t = now;
  drag.constraint.pointA.x = p.x;
  drag.constraint.pointA.y = p.y;
  Sleeping.set(drag.body, false);
});

function endDrag(e) {
  if (!drag) return;
  if (e && e.pointerId !== drag.pointerId) return;
  const body = drag.body;
  const vx = drag.vx, vy = drag.vy;
  Composite.remove(world, drag.constraint);
  drag = null;
  stage.classList.remove('grabbing');
  if (Math.hypot(vx, vy) > 0.18) {
    Sleeping.set(body, false);
    Body.setVelocity(body, { x: vx * CONFIG.fling, y: vy * CONFIG.fling });
    Body.setAngularVelocity(body, vx * 0.004);
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawBins() {
  bins.forEach(function (bin) {
    const x = bin.minX, y = bin.minY, w = bin.maxX - bin.minX, h = bin.maxY - bin.minY;
    ctx.save();
    if (bin.flash > 0) ctx.translate((Math.random() - 0.5) * 6 * bin.flash, 0);
    roundRect(x + 8, y + 8, w - 16, h - 16, 22);
    ctx.fillStyle = bin.flash > 0.2 ? 'rgba(244,63,94,0.16)' : 'rgba(255,255,255,0.04)';
    ctx.fill();
    ctx.lineWidth = bin.glow > 0.05 ? 3 : 1.5;
    ctx.strokeStyle = bin.glow > 0.05
      ? 'rgba(250,204,21,' + (0.35 + bin.glow * 0.65) + ')'
      : 'rgba(255,255,255,0.18)';
    ctx.stroke();
    ctx.fillStyle = '#E8EDF6';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 28px Inter, sans-serif';
    const lx = bin.side === 'left' ? x + w * 0.38 : x + w * 0.62;
    ctx.fillText(bin.label, lx, y + h * 0.46);
    ctx.font = '500 14px Inter, sans-serif';
    ctx.fillStyle = '#8A94A7';
    ctx.fillText(bin.sub, lx, y + h * 0.46 + 28);
    ctx.restore();
  });
}

function drawCards() {
  cards.forEach(function (b) {
    const L = b.lingo;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 8;
    roundRect(-L.w / 2, -L.h / 2, L.w, L.h, 14);
    const g = ctx.createLinearGradient(0, -L.h / 2, 0, L.h / 2);
    g.addColorStop(0, 'rgba(253,186,116,0.96)');
    g.addColorStop(0.5, 'rgba(249,115,22,0.94)');
    g.addColorStop(1, 'rgba(124,45,18,0.96)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.save();
    roundRect(-L.w / 2, -L.h / 2, L.w, L.h, 14);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-L.w / 2, -L.h / 2, L.w, L.h * 0.42);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    roundRect(-L.w / 2, -L.h / 2, L.w, L.h, 14);
    ctx.stroke();
    ctx.fillStyle = '#1C120C';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 26px Inter, sans-serif';
    ctx.fillText(L.text, 0, 1);
    ctx.restore();
  });
}

function drawGrab() {
  if (!drag) return;
  ctx.beginPath();
  ctx.moveTo(drag.px, drag.py);
  ctx.lineTo(drag.body.position.x, drag.body.position.y);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function renderFrame() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W * 0.32, H * 0.38, 40, W * 0.32, H * 0.38, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#1A120C');
  bg.addColorStop(1, '#070A12');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(
    fit * DPR, 0, 0, fit * DPR,
    (W / 2 - (CONFIG.worldW / 2) * fit) * DPR,
    (H / 2 - (CONFIG.worldH / 2) * fit) * DPR
  );
  if (layout) {
    drawBins();
    drawCards();
    drawGrab();
  }
}

function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(1, r.width);
  H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  fit = Math.min(W / CONFIG.worldW, H / CONFIG.worldH);
  art.width = Math.floor(W * DPR);
  art.height = Math.floor(H * DPR);
}

let acc = 0;
let last = performance.now();
function frame(t) {
  const dt = Math.min(48, Math.max(0, t - last));
  last = t;
  acc += dt;
  let guard = 0;
  while (acc >= CONFIG.step && guard < 3) {
    stepSim();
    acc -= CONFIG.step;
    guard++;
  }
  if (guard === 3) acc = 0;
  const k = Math.min(1, dt / 16.67);
  bins.forEach(function (b) {
    b.glow = Math.max(0, b.glow - 0.02 * k);
    b.flash = Math.max(0, b.flash - 0.04 * k);
  });
  renderFrame();
  requestAnimationFrame(frame);
}

document.getElementById('btnReset').addEventListener('click', resetRound);
window.addEventListener('resize', resize);
